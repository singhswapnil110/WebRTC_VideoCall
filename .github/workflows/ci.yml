name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  client-build:
    name: "Client — install & build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VideoCallApp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: VideoCallApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  server-install:
    name: "Server — install"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Socket_Server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Socket_Server/package-lock.json

      - name: Install dependencies
        run: npm ci
